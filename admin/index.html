<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masud JR Admin</title><link rel="stylesheet" href="style.css"></head><body><div id="login" class="auth"><div class="box"><div class="logo">MJ</div><h1>Masud JR Admin</h1><input id="user" placeholder="Admin username"><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="msg"></p></div></div><div id="app" class="hidden"><header><h1>Masud JR Admin</h1><button onclick="logout()">Logout</button></header><main><div class="cards"><div><span>Users</span><b id="users">0</b></div><div><span>Active</span><b id="active">0</b></div><div><span>Pending Withdrawals</span><b id="pending">0</b></div><div><span>Paid</span><b id="paid">৳0</b></div></div><section><h2>User Management</h2><div id="userTable"></div></section><section><h2>Task Management</h2><form id="taskForm"><input id="tTitle" placeholder="Task title"><input id="tType" placeholder="Type"><input id="tUrl" placeholder="URL"><input id="tReward" type="number" placeholder="Reward"><input id="tDesc" placeholder="Description"><button>Add Task</button></form><div id="taskTable"></div></section><section><h2>Fee Payment Verification</h2><div id="feeTable"></div></section><section><h2>Withdrawal Management</h2><div id="withdrawTable"></div></section><section><h2>Notice Management</h2><form id="noticeForm"><input id="nTitle" placeholder="Notice title"><textarea id="nMsg" placeholder="Notice message"></textarea><button>Add Notice</button></form><div id="noticeTable"></div></section></main></div><script src="script.js"></script></body></html>
